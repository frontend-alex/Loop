openapi: 3.0.3
info:
  title: Loop API
  version: 0.1.0
  description: |
    HTTP API for the Loop application.

    To access protected endpoints, use Authorize and enter a JWT obtained from
    the browser-based OAuth flow. Swagger UI sends it as a Bearer token in the
    Authorization header. Start login by opening /api/v1/auth/{provider} in a
    browser. After authentication, the callback redirects to
    loop://auth/callback?token=<JWT>; use that token to authorize API requests.
servers:
  - url: /
    description: Same server as the documentation
tags:
  - name: Health
    description: Server liveness and database readiness checks.
  - name: Authentication
    description: Browser-based OAuth login and provider callbacks. No Bearer token required.
  - name: Users
    description: Authenticated user information.
  - name: Onboarding
    description: |
      Account-owned draft saving and final-answer submission. Ownership comes
      from the authenticated user; IDs and timestamps are backend-controlled.
security: []
paths:
  /health/live:
    get:
      operationId: checkLiveness
      tags:
        - Health
      summary: Check whether the server is running
      responses:
        '204':
          description: The server is running. No response body.
  /health/ready:
    get:
      operationId: checkReadiness
      tags:
        - Health
      summary: Check whether the database is reachable
      responses:
        '204':
          description: The database is reachable. No response body.
        '503':
          description: The database is unavailable.
          content:
            text/plain:
              schema:
                type: string
              example: "database unavailable\n"
  /api/v1/auth/{provider}:
    get:
      operationId: beginAuthentication
      tags:
        - Authentication
      summary: Start OAuth login
      description: |
        Open this URL in a browser to sign in with a configured provider.
        Sets the _gothic_session cookie and redirects to the provider's
        authorization page. Keep the cookie for the callback request.
        Use browser navigation rather than Swagger UI's Try it out, since this
        flow follows external redirects and returns to the app via a deep link.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthProvider'
      responses:
        '307':
          description: Redirect to the provider's authorization page.
          headers:
            Location:
              description: Provider authorization URL, including the OAuth state.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: OAuth session cookie required by the callback.
              schema:
                type: string
        '400':
          description: The provider is unavailable or the OAuth session could not be started.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/{provider}/callback:
    get:
      operationId: completeAuthentication
      tags:
        - Authentication
      summary: Complete OAuth login
      description: |
        Provider redirect target, not a standalone login endpoint. Requires the
        _gothic_session cookie from the login request and the provider's callback
        parameters. The state must match the original OAuth session.
        On success, finds or creates the user, issues a JWT, and redirects to
        loop://auth/callback?token=<JWT>. No JSON token response is returned.
        Configure the provider's callback URL to this API route.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthProvider'
        - name: code
          in: query
          description: Authorization code returned by the provider after successful consent.
          schema:
            type: string
        - name: state
          in: query
          description: OAuth state returned by the provider; must match the login session.
          schema:
            type: string
        - name: error
          in: query
          description: Provider error returned instead of an authorization code when login fails.
          schema:
            type: string
      responses:
        '302':
          description: Authentication succeeded. Redirect to the app with the JWT.
          headers:
            Location:
              description: App deep link containing the JWT in the token query parameter.
              schema:
                type: string
                format: uri
                example: 'loop://auth/callback?token=eyJ...'
        '401':
          description: Provider authentication failed, the session is missing or invalid, or state does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: authentication_failed
                  message: state token mismatch
        '500':
          description: The user could not be authenticated locally or a JWT could not be issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: authentication_failed
                  message: Could not authenticate user
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      tags:
        - Users
      summary: Get the authenticated user
      description: Returns the user identified by the Bearer token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: The Bearer token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unauthorized
                  message: Invalid or expired token
        '500':
          description: The user could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: user_lookup_failed
                  message: Could not load user
  /api/v1/onboarding/update:
    patch:
      operationId: updateOnboarding
      tags:
        - Onboarding
      summary: Update onboarding answers and resume checkpoint
      description: |
        Send answers and currentStep together, without a data envelope. The user
        is identified by the Bearer token; do not send a user ID or timestamps.

        The examples use the question IDs and choices from
        apps/ios/loop/Features/Onboarding/Onboarding.swift. Synthesized
        QuestionAnswer Codable values use single/multiple/time objects with an
        unlabeled associated value named _0. With the default JSONEncoder,
        Date is seconds since 2001-01-01T00:00:00Z, not Unix time or an ISO string.

        Replaces the entire saved answer snapshot, rather than merging it.
        Drafts may omit unanswered questions or send answers: {} to clear them.
        Submitted answers must match one supported questionnaire: current stable
        option IDs or the released legacy questionnaire. Unknown IDs, mixed
        questionnaires, invalid options and malformed enum payloads return 400
        invalid_onboarding_data. Partial/empty drafts are allowed. currentStep
        is 0–8 (five question pages, alarm, apps, tasks, then summary).
        Completed onboarding rejects draft saves.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
            examples:
              partialDraft:
                summary: Backward-compatible draft from the released legacy client
                value:
                  currentStep: 2
                  answers:
                    focus:
                      single:
                        _0: High
                    distractions:
                      multiple:
                        _0:
                          - Social media
                          - Messages
              allQuestionAnswers:
                summary: All five current iOS question answers
                description: |
                  The workday-wake-time value represents 2026-11-09T07:00:00Z using
                  Swift's default Date encoding. It is an example instant,
                  not an agreed recurring wake-time/timezone contract.
                value:
                  currentStep: 8
                  answers:
                    morning-goal:
                      single:
                        _0: build-routine
                    workday-wake-time:
                      time:
                        _0: 815900400
                    waking-style:
                      single:
                        _0: first-alarm
                    first-phone-use:
                      single:
                        _0: within-10-min
                    morning-time-available:
                      single:
                        _0: 15-30-min
      responses:
        '204':
          description: Draft answers and current step saved. No response body.
        '400':
          $ref: '#/components/responses/InvalidOnboardingBody'
        '401':
          $ref: '#/components/responses/OnboardingUnauthorized'
        '404':
          $ref: '#/components/responses/OnboardingNotFound'
        '409':
          $ref: '#/components/responses/OnboardingAlreadyCompleted'
        '413':
          $ref: '#/components/responses/OnboardingBodyTooLarge'
        '415':
          $ref: '#/components/responses/OnboardingUnsupportedMediaType'
        '500':
          $ref: '#/components/responses/OnboardingFailure'
  /api/v1/onboarding/complete:
    patch:
      operationId: completeOnboarding
      tags:
        - Onboarding
      summary: Save final answers and complete onboarding
      description: |
        Send the final answers and currentStep together, without a data envelope.
        Uses the same OnboardingRequest schema as Update. Saves answers,
        currentStep, and server-generated CompletedAt atomically. A prior draft
        save is not required. All five valid answers from one supported
        questionnaire and currentStep: 8 are required. Incomplete, unknown,
        mixed, malformed, or invalid answers return 400 invalid_onboarding_data
        before persistence. Legacy clients' five-question payloads remain supported.

        A repeated completion succeeds without changing the original final
        answers, step, or completion timestamp. Concurrent completions preserve
        the first successful snapshot, and later draft saves cannot overwrite it.
        Ownership comes from the Bearer token; do not send IDs or timestamps.
        Answer encoding and step-numbering caveats are the same as for Update.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OnboardingRequest'
                - type: object
                  required: [answers, currentStep]
                  properties:
                    currentStep:
                      type: integer
                      enum: [8]
                    answers:
                      type: object
                      minProperties: 5
                      maxProperties: 5
            examples:
              finalAnswers:
                summary: Final snapshot of all five question answers
                value:
                  currentStep: 8
                  answers:
                    morning-goal:
                      single:
                        _0: build-routine
                    workday-wake-time:
                      time:
                        _0: 815900400
                    waking-style:
                      single:
                        _0: first-alarm
                    first-phone-use:
                      single:
                        _0: within-10-min
                    morning-time-available:
                      single:
                        _0: 15-30-min
      responses:
        '204':
          description: Onboarding completed, or already completed. No response body.
        '400':
          $ref: '#/components/responses/InvalidOnboardingBody'
        '401':
          $ref: '#/components/responses/OnboardingUnauthorized'
        '404':
          $ref: '#/components/responses/OnboardingNotFound'
        '413':
          $ref: '#/components/responses/OnboardingBodyTooLarge'
        '415':
          $ref: '#/components/responses/OnboardingUnsupportedMediaType'
        '500':
          $ref: '#/components/responses/OnboardingFailure'
components:
  parameters:
    AuthProvider:
      name: provider
      in: path
      required: true
      description: OAuth provider name. The provider must be configured on the server.
      schema:
        type: string
        enum: [google, apple]
        example: google
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the JWT only, without the Bearer prefix.
  responses:
    InvalidOnboardingBody:
      description: |
        The body is empty, malformed, contains an unknown top-level field,
        contains a value of the wrong Go type, or has trailing JSON content.
        Also returned as invalid_onboarding_data for invalid questionnaire
        content, out-of-range steps, or an incomplete final submission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidQuestionnaire:
              value:
                error:
                  code: invalid_onboarding_data
                  message: 'invalid onboarding data: all five questionnaire answers are required'
            emptyBody:
              value:
                error:
                  code: invalid_request_body
                  message: Request body must not be empty
            unknownField:
              value:
                error:
                  code: invalid_request_body
                  message: 'Request body contains unknown field "completedAt"'
    OnboardingUnauthorized:
      description: The Bearer token is missing, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Invalid or expired token
    OnboardingNotFound:
      description: No onboarding record exists for the authenticated user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: onboarding_not_found
              message: Onboarding not found
    OnboardingAlreadyCompleted:
      description: Draft updates cannot modify completed onboarding.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: onboarding_completed
              message: Completed onboarding cannot be updated
    OnboardingBodyTooLarge:
      description: The body exceeds the decoder's 1048576-byte (1 MiB) read limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_request_body
              message: Request body must not be larger than 1048576 bytes
    OnboardingUnsupportedMediaType:
      description: A supplied Content-Type is not application/json. The current decoder permits a missing header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_request_body
              message: Content-Type header is not application/json
    OnboardingFailure:
      description: An unexpected request-body decoding or database error occurred. Success is not reported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: onboarding_save_failed
              message: Could not save onboarding
  schemas:
    OnboardingRequest:
      type: object
      additionalProperties: false
      description: |
        Shared by Update and Complete, matching the Go OnboardingRequest DTO.
        Swift sends answers and currentStep. Answers replace the saved snapshot.
        Partial/empty drafts are allowed. Completion requires all five answers
        from either the current or legacy questionnaire and currentStep: 8.
        Submitted values are validated against the chosen questionnaire.
        In drafts, omitted answers default to null and currentStep to zero.
        Database-managed fields are rejected by the existing JSON decoder.
      properties:
        answers:
          $ref: '#/components/schemas/OnboardingAnswers'
        currentStep:
          type: integer
          minimum: 0
          maximum: 8
          description: |
            Resume checkpoint: question pages 0–4, alarm 5, apps 6, tasks 7,
            summary 8. Completion requires 8.
          example: 2
    OnboardingAnswers:
      type: object
      description: |
        Swift Codable answer shapes. Use only current IDs or only legacy IDs;
        mixing the two versions and unknown IDs is rejected. Single choices
        must use the documented values. Legacy multiple choices must be unique
        and nonempty at completion. Time values must be finite numbers in
        Swift's reference-date encoding. Drafts may omit unanswered questions.
      nullable: true
      additionalProperties: false
      properties:
        morning-goal:
          description: 'Current single choice: get-up-on-time, stop-scrolling, build-routine, feel-awake.'
          allOf:
            - $ref: '#/components/schemas/SingleQuestionAnswer'
        workday-wake-time:
          $ref: '#/components/schemas/TimeQuestionAnswer'
        waking-style:
          description: 'Current single choice: first-alarm, snooze-1-2, snooze-3-plus, several-alarms.'
          allOf:
            - $ref: '#/components/schemas/SingleQuestionAnswer'
        first-phone-use:
          description: 'Current single choice: in-bed, within-10-min, within-30-min, later.'
          allOf:
            - $ref: '#/components/schemas/SingleQuestionAnswer'
        morning-time-available:
          description: 'Current single choice: under-15-min, 15-30-min, 30-60-min, over-60-min.'
          allOf:
            - $ref: '#/components/schemas/SingleQuestionAnswer'
        focus:
          description: 'Single choice: Low, Medium, or High.'
          allOf:
            - $ref: '#/components/schemas/SingleQuestionAnswer'
        distractions:
          description: 'Multiple choices: Social media, Games, Messages.'
          allOf:
            - $ref: '#/components/schemas/MultipleQuestionAnswer'
        wake-time:
          $ref: '#/components/schemas/TimeQuestionAnswer'
        goals:
          description: 'Multiple choices: Focus, Exercise, Reading.'
          allOf:
            - $ref: '#/components/schemas/MultipleQuestionAnswer'
        experience:
          description: 'Single choice: Beginner, Intermediate, or Advanced.'
          allOf:
            - $ref: '#/components/schemas/SingleQuestionAnswer'
    SingleQuestionAnswer:
      type: object
      additionalProperties: false
      required:
        - single
      properties:
        single:
          type: object
          additionalProperties: false
          required:
            - _0
          properties:
            _0:
              type: string
    MultipleQuestionAnswer:
      type: object
      additionalProperties: false
      required:
        - multiple
      properties:
        multiple:
          type: object
          additionalProperties: false
          required:
            - _0
          properties:
            _0:
              type: array
              uniqueItems: true
              description: Encoded Swift Set<String>; element order is not significant.
              items:
                type: string
    TimeQuestionAnswer:
      type: object
      additionalProperties: false
      required:
        - time
      properties:
        time:
          type: object
          additionalProperties: false
          required:
            - _0
          properties:
            _0:
              type: number
              format: double
              description: |
                Default Swift Date Codable representation: seconds since
                2001-01-01T00:00:00Z. Changing JSONEncoder.dateEncodingStrategy
                requires updating this schema and its examples.
              example: 815900400
    UserResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required: [User, requiresOnboarding]
          properties:
            User:
              $ref: '#/components/schemas/User'
            requiresOnboarding:
              type: boolean
              description: True when the authenticated account has not completed onboarding.
    User:
      type: object
      description: Field names match the current Go user model's JSON output.
      required:
        - ID
        - Email
        - Name
        - AvatarURL
        - CreatedAt
        - UpdatedAt
      properties:
        ID:
          type: integer
          minimum: 0
          example: 1
        Email:
          type: string
          example: user@example.com
        Name:
          type: string
          example: Alex
        AvatarURL:
          type: string
          example: https://example.com/avatar.png
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code.
              example: unauthorized
            message:
              type: string
              description: Human-readable error details.
              example: Invalid or expired token
