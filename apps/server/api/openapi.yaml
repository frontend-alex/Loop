openapi: 3.0.3
info:
  title: Loop API
  version: 0.1.0
  description: |
    HTTP API for the Loop application.

    To access protected endpoints, use Authorize and enter a JWT obtained from
    the browser-based OAuth flow. Swagger UI sends it as a Bearer token in the
    Authorization header. OAuth login endpoints are not documented here.
servers:
  - url: /
    description: Same server as the documentation
tags:
  - name: Health
    description: Server liveness and database readiness checks.
  - name: Users
    description: Authenticated user information.
security: []
paths:
  /health/live:
    get:
      operationId: checkLiveness
      tags:
        - Health
      summary: Check whether the server is running
      responses:
        '204':
          description: The server is running. No response body.
  /health/ready:
    get:
      operationId: checkReadiness
      tags:
        - Health
      summary: Check whether the database is reachable
      responses:
        '204':
          description: The database is reachable. No response body.
        '503':
          description: The database is unavailable.
          content:
            text/plain:
              schema:
                type: string
              example: "database unavailable\n"
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      tags:
        - Users
      summary: Get the authenticated user
      description: Returns the user identified by the Bearer token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: The Bearer token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unauthorized
                  message: Invalid or expired token
        '500':
          description: The user could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: user_lookup_failed
                  message: Could not load user
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the JWT only, without the Bearer prefix.
  schemas:
    UserResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/User'
    User:
      type: object
      description: Field names match the current Go user model's JSON output.
      required:
        - ID
        - Email
        - Name
        - AvatarURL
        - CreatedAt
        - UpdatedAt
      properties:
        ID:
          type: integer
          minimum: 0
          example: 1
        Email:
          type: string
          example: user@example.com
        Name:
          type: string
          example: Alex
        AvatarURL:
          type: string
          example: https://example.com/avatar.png
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code.
              example: unauthorized
            message:
              type: string
              description: Human-readable error details.
              example: Invalid or expired token
