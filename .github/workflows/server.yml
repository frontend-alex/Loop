name: Server CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Validate Server
        run: |
          gofmt -l .
          go mod download
          go mod verify
          go vet ./...
          go test ./... -coverprofile=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: apps/server/coverage.out
          if-no-files-found: error
        # TODO fix later... attaching coverage.out since sonarqubes coverage is at 0 and does not pick up the tests?
        
  snyk:
    name: Snyk server dependency scan
    if: &trusted_event >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check Snyk configuration
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: ': "${SNYK_TOKEN:?Add the SNYK_TOKEN repository secret}"'

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Set up Snyk
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce

      - name: Scan Go dependencies
        working-directory: apps/server
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --org=frontend-alex --file=go.mod

  sonarqube:
    name: Sonarqube server quality gate
    needs: server
    if: *trusted_event
    runs-on: ubuntu-latest
    steps:
      - name: Check Sonarqube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          : "${SONAR_TOKEN:?Add the SONAR_TOKEN repository secret}"
          : "${SONAR_ORGANIZATION:?Add the SONAR_ORGANIZATION repository variable}"

      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false # ! belongs to checkout not caching. It prevents checkout from leaving GitHub credentials in Git configuration.

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: server-coverage
          path: apps/server

      - name: Cache Sonar analyzers
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache # caches downloaded analyzer
          key: ${{ runner.os }}-sonar #  identifies the cache.
          restore-keys: ${{ runner.os }}-sonar # a fallback prefix used to find a cache when the exact key isnt found.

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: apps/server
          args: -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  publish:
    needs: [server, snyk, sonarqube]
   # Publish only on pushes to develop.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ vars.BACKEND_IMAGE_REPO }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./apps/server # point it to the direction of server docker file to build it 
          push: true
          tags: ${{ vars.BACKEND_IMAGE_REPO }}:${{ github.sha }}

  staging:
    if: vars.STAGING_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - name: Deploy and smoke-test staging
        env:
          BACKEND_IMAGE: ${{ needs.publish.outputs.image }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: sh scripts/deploy.sh

  approve-image:
    needs: [publish, staging]
    runs-on: ubuntu-latest
    environment: staging-qa
    steps:
      - name: Record the approved image
        env:
          BACKEND_IMAGE: ${{ needs.publish.outputs.image }}
        run: printf '%s\n' "$BACKEND_IMAGE" > approved-image.txt

      - uses: actions/upload-artifact@v4
        with:
          name: approved-image-${{ github.run_attempt }}
          path: approved-image.txt
          if-no-files-found: error
